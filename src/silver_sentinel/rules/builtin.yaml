  # ---------------------------------------------------------------- 技术特征
  - id: TEC-001
    category: technical
    title: 敏感权限组合
    weight: 18
    confidence: 0.7
    when:
      fact: dangerous_permission_count
      op: gte
      value: 3
    detail: 同时申请短信、通讯录、录音等与业务无关的高危权限。

  - id: TEC-002
    category: technical
    title: 申请无障碍服务
    weight: 20
    confidence: 0.8
    when:
      fact: has_accessibility
      op: eq
      value: true
    detail: 无障碍服务可模拟点击、读取屏幕内容，是控屏类木马的核心能力。
    cite: 工信部反诈专班对仿冒 App 的技术分析

  - id: TEC-003
    category: technical
    title: 悬浮窗权限
    weight: 12
    confidence: 0.6
    when:
      fact: has_overlay
      op: eq
      value: true
    detail: 悬浮窗可覆盖真实界面实施诱导点击。

  - id: TEC-004
    category: technical
    title: 动态加载/加固壳
    weight: 12
    confidence: 0.55
    when:
      fact: has_dynamic_loading
      op: eq
      value: true
    detail: 关键逻辑运行时下发，规避静态检测与商店审核。

  - id: TEC-005
    category: technical
    title: 请求安装其他应用
    weight: 22
    confidence: 0.85
    when:
      fact: requests_install_packages
      op: eq
      value: true
    detail: 具备自我更新/投放马甲包能力，常见于持续换皮的诈骗 App。

  - id: TEC-006
    category: technical
    title: 内嵌钱包/收款地址
    weight: 20
    confidence: 0.9
    when:
      fact: wallet_addresses
      op: nonempty
    detail: 安装包内硬编码虚拟货币地址，直接指向资金归集环节。

  - id: TEC-007
    category: technical
    title: WebView 暴露原生桥接
    weight: 10
    confidence: 0.5
    when:
      fact: has_js_bridge
      op: eq
      value: true
    detail: H5 页面可直接调用原生能力，便于快速换皮而不改安装包。

  - id: TEC-008
    category: technical
    title: 调试签名或未签名
    weight: 10
    confidence: 0.7
    when:
      fact: debug_signed
      op: eq
      value: true
    detail: 使用 Android 调试证书打包，说明出自非正规开发流程。

  - id: TEC-009
    category: technical
    title: 短信读取与拦截
    weight: 22
    confidence: 0.85
    when:
      all:
        - fact: permissions
          op: contains
          value: android.permission.READ_SMS
        - any:
            - fact: permissions
              op: contains
              value: android.permission.RECEIVE_SMS
            - fact: permissions
              op: contains
              value: android.permission.PROCESS_OUTGOING_CALLS
    detail: 可读取银行验证码短信，直接威胁资金账户。

