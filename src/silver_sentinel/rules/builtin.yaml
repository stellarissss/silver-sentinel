# 分档下界。注意：confirmed 不由分数直接授予，必须有人工复核或官方通报，
# 否则最高只到 high_risk —— 反诈工具误伤一个正常应用的代价，远高于漏报一次。
thresholds:
  suspicious: 15
  high_risk: 35
  confirmed: 70
