# 银发哨兵 · 判定规则库
#
# weight  = 该信号单独成立时，指向「涉老诈骗」的强度（0-100 的百分比量纲）
# confidence = 我们对这条信号本身可靠性的把握（0-1）
# 二者相乘后进入 noisy-OR 聚合，避免「十条弱信号」被当成「一条铁证」。
#
# 依据来源：央视网 2026-10-31 涉老诈骗典型案例、北京市药监局消费警示、
# 工信部反诈专班「涉诈高风险 APP 早知道」、公安部涉诈 APP 通报、
# 武汉东西湖区/日照警方公开案情。规则只描述可观测特征，不对具体主体下结论。

version: 2

