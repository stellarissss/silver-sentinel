    detail: 承诺无条件发放或恢复百万级以上资产，是民族资产解冻类骗局的标志性许诺。
    cite: 公安部民族资产解冻类诈骗专项；媒体披露的「资产恢复」话术

  # ---------------------------------------------------------------- 词库主题
  # 由 discover/keywords.py 的词库产出。分两档，互斥，避免同一件事被计两次。
  - id: KW-001
    category: impersonation
    title: 命中强主题词根（机构冒充/骗局专属）
    weight: 26
    confidence: 0.7
    when:
      # 只认「机构名」与「骗局专属词」两类。品牌词（weixin/douyin/taobao）
      # 单独出现太常见：微信投票工具、抖音代运营、站群域名都会命中，
      # 把它留到 KW-003 用低权重计，避免一条品牌词就把线索推进 watch。
      any:
        - fact: keyword_clusters
          op: contains
          value: scam_signature
        # 机构名（供销社/老龄委/乡村振兴局…）本身只是**手段**，必须与政策或
        # 涉老主题同现才算骗局特征。否则「gongxiaoshe88.com」这种把拼音域名
        # 挂上加速器下载站的抢注域名会白拿 26 分直接进 watch。
        # 不接受 inducement 作旁证：「免费试用」「福利」在软件站同样常见。
        - all:
            - fact: keyword_clusters
              op: contains
              value: authority
            - any:
                - fact: keyword_clusters
                  op: contains
                  value: policy_theme
                - fact: keyword_clusters
                  op: contains
                  value: elder_care
    detail: 语料出现真黑话，或机构名与政策/涉老主题同现——非官方主体冒用权威名义的典型特征。
    cite: 词库 cluster=authority/scam_signature

  - id: KW-004
    category: impersonation
    title: 语料单提机构名（弱信号）
    weight: 10
    confidence: 0.4
    when:
      all:
        - fact: keyword_clusters
          op: contains
          value: authority
        - not:
            fact: keyword_clusters
            op: contains
            value: scam_signature
        - not:
            fact: keyword_clusters
            op: contains
            value: policy_theme
        - not:
            fact: keyword_clusters
            op: contains
            value: elder_care
    detail: 仅出现机构名而无配套的政策/涉老话术，可能只是行业站或抢注域名，不作定性依据。
    cite: 词库 cluster=authority

  - id: KW-003
    category: impersonation
    title: 语料提及被冒用品牌
    weight: 12
    confidence: 0.55
    when:
      all:
        - fact: keyword_clusters
          op: contains
          value: brand
        - not:
            fact: keyword_clusters
            op: contains
            value: authority
    detail: 出现微信/抖音/支付宝等品牌词。单凭这一点不足以定性——正规服务商同样会提及，需结合域名仿冒与页面话术。
    cite: 词库 cluster=brand

  - id: KW-002
    category: impersonation
    title: 命中多个政策/诱导主题词
    weight: 14
    confidence: 0.55
    when:
      all:
        - fact: keyword_hint
          op: gte
          value: 0.5
        - not:
            fact: keyword_hint
            op: gte
            value: 0.8
    detail: 语料反复出现养老、补贴、免费领、签到等主题词，符合「以福利为饵」的话术结构。
    cite: 词库 cluster=policy_theme/inducement

