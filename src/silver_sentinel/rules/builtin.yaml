  - id: PER-006
    category: persuasion
    title: 索要身份证/人脸/验证码
    weight: 20
    confidence: 0.85
    when:
      # 关键词本身不构成「索要」：投票系统会写「验证码防刷」，银行会写
      # 「人脸识别」，这些都不是骗局。必须出现「要/给/发/上传」的动作，
      # 或与「领取」同现——这正是公安提醒里的那句「要扫码、填身份证、
      # 给验证码、刷脸才能领礼品」。
      any:
        - text_any:
            - 提供验证码
            - 告诉我验证码
            - 报一下验证码
            - 把验证码发
            - 验证码发给
            - 索要验证码
        - text_all: [身份证, 领取]
        - text_all: [手持身份证, 照片]
        - text_all: [人脸识别, 领取]
        - text_all: [刷脸, 领取]
        - text_all: [银行卡号, 填写]
        - text_all: [验证码, 领取]
