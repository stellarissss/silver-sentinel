rules:
  # ---------------------------------------------------------------- 分发渠道
  - id: DIST-001
    category: distribution
    title: 非应用商店分发
    weight: 18
    confidence: 0.9
    when:
      fact: distribution_channel
      op: in
      value: [sideload, qr, link]
    detail: 只能通过外链、二维码或他人转发安装，应用商店无对应条目。
    cite: 工信部反诈专班；涉诈 App 普遍规避应用商店审核

  - id: DIST-002
    category: distribution
    title: 无 ICP 备案
    weight: 16
    confidence: 0.85
    when:
      fact: icp_registered
      op: eq
      value: false
    detail: 境内提供服务的网站/应用未履行 ICP 备案，属违规运营。
    cite: 《互联网信息服务管理办法》

  - id: ICP-001
    category: reputation
    title: 列入工信部违法违规名单
    weight: 34
    confidence: 0.95
    when:
      fact: icp_violation
      op: eq
      value: listed
    detail: 工信部备案系统「违法违规域名查询」已将该域名列管，属官方定性依据。
    cite: 工信部 ICP/IP地址/域名信息备案管理系统 · 违法违规域名查询

  - id: DIST-003
    category: distribution
    title: 域名注册时间过短
    weight: 12
    confidence: 0.7
    when:
      fact: domain_age_days
      op: lt
      value: 90
    detail: 域名启用不足 90 天即大规模推广，符合「打一枪换一个域名」的资金盘节奏。

  - id: DIST-004
    category: distribution
    title: 短链跳转
    weight: 10
    confidence: 0.6
    when:
      fact: is_shortener
      op: eq
      value: true
    detail: 用短链隐藏真实落地域名，规避平台风控与老人识别。

  - id: DIST-005
    category: distribution
    title: 寄生免费托管/临时隧道
    weight: 14
    confidence: 0.7
    when:
      fact: is_free_hosting
      op: eq
      value: true
    detail: 落地页挂在免费托管或临时隧道域名上，成本低、易弃用。

  - id: DIST-006
    category: distribution
    title: 使用低价批量 TLD
    weight: 6
    confidence: 0.5
    when:
      fact: cheap_tld
      op: eq
      value: true
    detail: 批量注册成本极低的顶级域，常见于一次性诈骗站群。

  - id: DIST-007
    category: distribution
    title: 落地页强制下载安装包
    weight: 14
    confidence: 0.75
    when:
      fact: forces_apk_download
      op: eq
      value: true
    detail: 页面不提供任何实质内容，直接弹下载或引导「点击安装」。

  - id: DIST-008
    category: distribution
    title: 指导关闭安全检测
    weight: 24
    confidence: 0.9
    when:
      text_any:
        - 关闭安全检测
        - 忽略风险
        - 继续安装
        - 允许未知来源
        - 关闭纯净模式
        - 信任此应用
        - 解除管控
        - 关闭手机管家
    detail: 主动教用户绕过系统安装防护，正规应用不会提出此类要求。
    cite: 安卓系统对未备案/未检测应用的默认拦截提示

