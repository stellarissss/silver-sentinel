[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "silver-sentinel"
version = "0.1.0"
description = "银发哨兵：涉老诈骗（领鸡蛋引流 / 仿冒国家项目 App）识别、记录、监控、分析与处置闭环"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Silver Sentinel Contributors" }]
keywords = ["anti-fraud", "elderly", "scam", "apk", "threat-intelligence"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
silver-sentinel = "silver_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
silver_sentinel = ["rules/*.yaml", "data/*.yaml", "web/templates/*", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
