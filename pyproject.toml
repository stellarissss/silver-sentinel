[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "silver-sentinel"
version = "1.12.0"
description = "银发哨兵：涉老诈骗的持续发现、动态取证、图谱归因与处置闭环"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Silver Sentinel Contributors" }]
keywords = ["anti-fraud", "elderly", "scam", "apk", "threat-intelligence", "ct-log", "osint"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Intended Audience :: Information Technology",
]

# 核心依赖：装完即可跑「发现 → 研判 → 图谱 → 控制台」全链路。
# 沙箱执行、S3 副本、certstream 流式接入都是可选项，缺了自动降级并在运维页明示。
dependencies = [
    "fastapi>=0.110",
    "starlette>=0.36",            # TemplateResponse 的 request-first 签名
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "cryptography>=42",          # 解析 CT 日志里的 DER 证书，取 CN / SAN
    "dnspython>=2.6",            # 域名排列探测 + 内网地址判定
    "pypinyin>=0.51",            # 中文词根自动派生拼音变体（guohui / zhongke ...）
    "beautifulsoup4>=4.12",      # 自称抽取（header/版权行/短块）与用途特征。
                                 # 缺了不会崩，但 claim/features 会静默返回空——
                                 # 线上真踩过：判定全退化成「只看域名」还看不出来。
    "networkx>=3.2",             # 社区发现（Louvain / 连通分量）
    "socksio>=1.0",              # SOCKS5 代理（出站隔离）
    "pillow>=10.0",              # 截图裁剪 + dHash 指纹（变更检测要用）
    # 用途分类模型（HistGradientBoosting）。规则基线不依赖它，
    # 但生产要「机器学习保细」就必须有——所以放主依赖而不是可选。
    "scikit-learn>=1.3",
    "joblib>=1.3",
]

[project.optional-dependencies]
# 真实浏览器执行（网页取证）。装完还需 `playwright install chromium`。
sandbox = ["playwright>=1.44"]
# certstream WebSocket 实时流（主路是直连 CT log，这条是补强）
stream = ["websockets>=13"]
# 异地副本的 S3/MinIO 后端
s3 = ["boto3>=1.34"]
# Neo4j 图数据库（不装则用内置 SQLite 图引擎）
neo4j = ["neo4j>=5.20"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "build>=1.2"]
# 一次装全
full = [
    "playwright>=1.44",
    "websockets>=13",
    "boto3>=1.34",
    "neo4j>=5.20",
]

[project.scripts]
silver-sentinel = "silver_sentinel.cli:main"

[project.urls]
Homepage = "https://github.com/stellarissss/silver-sentinel"
Issues = "https://github.com/stellarissss/silver-sentinel/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
silver_sentinel = [
    "rules/*.yaml",
    "data/*.yaml",
    "data/*.gz",
    "data/*.txt",
    "data/*.joblib",
    "data/*.jsonl",
    "web/templates/*",
    "web/static/*",
]
# 12377 的类别树是运行时读的，漏了会在举报第一步就 FileNotFoundError
"silver_sentinel.report" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042（str+Enum → StrEnum）不改：`f"{AssetKind.URL}"` 在 str+Enum 下是
# "AssetKind.URL"、在 StrEnum 下是 "url"，会悄悄改掉日志与导出文件的文本。
ignore = ["E501", "B008", "UP042"]
